<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#1b263b"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ff6b4a"/><stop offset="50%" stop-color="#ff9f43"/><stop offset="100%" stop-color="#00d2d3"/></linearGradient><linearGradient id="queueGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ff6b4a" stop-opacity=".2"/><stop offset="100%" stop-color="#ff9f43" stop-opacity=".05"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes floatPacket1{0%{transform:translate(0,0);opacity:0}15%,85%{opacity:.8}}@keyframes floatPacket2{0%{transform:translate(0,0);opacity:0}20%,80%{opacity:.7}}@keyframes pulseOrb{0%{transform:scale(1);opacity:.35}50%{transform:scale(1.18);opacity:.6}}@keyframes waveFlow{0%{stroke-dashoffset:0}}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:50px;fill:#fff;letter-spacing:-1px}.subtitle-text{font-weight:400;font-size:19px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.packet-1{animation:floatPacket1 5s linear infinite}.packet-2{animation:floatPacket2 6.5s linear infinite 1.8s}.packet-3{animation:floatPacket1 4.2s linear infinite 2.5s}.orb-pulse{transform-origin:center;animation:pulseOrb 6s ease-in-out infinite}.flow-line{stroke-dasharray:8 6;animation:waveFlow 3s linear infinite}</style><rect width="1200" height="360" fill="url(#bgGradient)" rx="16"/><g stroke="#fff" stroke-width="1" opacity=".07"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="450" x2="450" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="750" x2="750" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/><line x1="1050" x2="1050" y1="0" y2="360"/></g><circle cx="1080" cy="80" r="140" fill="#ff6b4a" class="orb-pulse" filter="url(#glow)" style="animation-duration:7s"/><circle cx="980" cy="280" r="160" fill="#00d2d3" class="orb-pulse" filter="url(#glow)" style="animation-duration:9s;animation-delay:2s"/><g opacity=".4"><path fill="none" stroke="#ff9f43" stroke-width="2" d="M 520 80 C 720 80, 800 130, 1140 130" class="flow-line"/><path fill="none" stroke="#00d2d3" stroke-width="2" d="M 520 280 C 700 280, 820 230, 1140 230" class="flow-line"/><g class="packet-1"><circle cx="560" cy="80" r="5" fill="#ff6b4a" filter="url(#glow)"/></g><g class="packet-2"><circle cx="540" cy="280" r="6" fill="#00d2d3" filter="url(#glow)"/></g><g class="packet-3"><circle cx="580" cy="80" r="4" fill="#fff" filter="url(#glow)"/></g></g><g transform="translate(80, 52)"><rect width="180" height="28" fill="url(#accentGrad)" fill-opacity=".18" stroke="url(#accentGrad)" stroke-width="1.2" rx="14"/><circle cx="16" cy="14" r="5" fill="#ff6b4a"/><text x="30" y="19" fill="#ff9f43" class="badge-text">ENTERPRISE MESSAGING</text></g><g><text x="0" y="0" class="title-text" transform="translate(80, 138)">Awesome AMQP Client Libraries</text><text x="0" y="42" class="subtitle-text" transform="translate(80, 138)">Curated ecosystem of AMQP 0-9-1 &amp; 1.0 protocols, message brokers, task queues &amp; cloud middleware</text></g><g><g transform="translate(80, 240) translate(0, 0)"><rect width="130" height="38" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="22" y="24" fill="#f8fafc" class="badge-text">🐇 RabbitMQ</text></g><g transform="translate(80, 240) translate(142, 0)"><rect width="168" height="38" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="20" y="24" fill="#f8fafc" class="badge-text">⚡ AMQP 0-9-1 / 1.0</text></g><g transform="translate(80, 240) translate(322, 0)"><rect width="160" height="38" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="20" y="24" fill="#f8fafc" class="badge-text">🌿 Celery &amp; Kombu</text></g><g transform="translate(80, 240) translate(494, 0)"><rect width="165" height="38" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="20" y="24" fill="#f8fafc" class="badge-text">☁️ SQS &amp; Azure Bus</text></g></g><rect width="1200" height="360" x="0" y="0" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity=".4" rx="16"/></svg>